name: Deploy Dashboard to GitHub Pages

on:
  workflow_run:
    workflows: ["Collect Weekly Investment Data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandas
        run: pip install pandas

      - name: Download latest weekly data artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --workflow=collect_weekly.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          gh run download "$RUN_ID" -n weekly-investment-data -D data

      - name: Build HTML dashboard
        run: |
          python src/visualizers/build_dashboard.py --data-dir data --output _site/index.html
          python src/visualizers/build_spread_page.py --data-dir data --output _site/spread.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
