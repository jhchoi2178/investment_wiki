name: Collect Weekly Investment Data

on:
  schedule:
    # 매주 토요일 오전 10:00 (KST) = UTC 01:00
    - cron: "0 1 * * 6"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly data collector
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: python src/main.py --start 2020-01-01

      - name: Build HTML dashboard
        run: python src/visualizers/build_dashboard.py --data-dir data --output data/dashboard.html

      - name: Upload to Google Drive (data/weekly)
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: python src/utils/gdrive_uploader.py

      - name: Upload collected CSVs and dashboard
        uses: actions/upload-artifact@v4
        with:
          name: weekly-investment-data
          path: |
            data/*.csv
            data/dashboard.html
